<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LaLiga Eredménykövető</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f2f4f8;
        color: #172033;
    }

    header {
        background: linear-gradient(135deg, #e30613, #7b0010);
        color: white;
        padding: 25px;
        text-align: center;
        box-shadow: 0 3px 10px rgba(0,0,0,.2);
    }

    header h1 {
        margin: 0;
        font-size: 32px;
    }

    header p {
        margin: 8px 0 0;
        opacity: .9;
    }

    .container {
        max-width: 1200px;
        margin: 25px auto;
        padding: 0 15px;
    }

    .round-selector {
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0,0,0,.08);
        margin-bottom: 25px;
    }

    .round-selector h2 {
        margin-top: 0;
    }

    .round-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: 8px;
    }

    .round-button {
        border: none;
        padding: 10px 5px;
        border-radius: 8px;
        background: #e9edf3;
        cursor: pointer;
        font-weight: bold;
        transition: .2s;
    }

    .round-button:hover {
        background: #d7dce5;
    }

    .round-button.active {
        background: #e30613;
        color: white;
    }

    .content {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 25px;
    }

    .card {
        background: white;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card h2 {
        margin-top: 0;
        border-bottom: 2px solid #eee;
        padding-bottom: 12px;
    }

    .match {
        display: grid;
        grid-template-columns: 1fr 70px 1fr;
        align-items: center;
        gap: 10px;
        padding: 15px 5px;
        border-bottom: 1px solid #eee;
    }

    .team {
        font-weight: bold;
    }

    .home {
        text-align: right;
    }

    .away {
        text-align: left;
    }

    .score {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        background: #f1f3f6;
        padding: 8px 4px;
        border-radius: 8px;
    }

    .time {
        color: #888;
        font-size: 14px;
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #172033;
        color: white;
        padding: 10px 5px;
        font-size: 13px;
    }

    td {
        padding: 10px 5px;
        border-bottom: 1px solid #eee;
        text-align: center;
        font-size: 14px;
    }

    td:nth-child(2) {
        text-align: left;
        font-weight: bold;
    }

    .position {
        font-weight: bold;
        width: 35px;
    }

    .team-logo {
        width: 27px;
        height: 27px;
        border-radius: 50%;
        background: #e30613;
        color: white;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        margin-right: 5px;
        font-size: 11px;
    }

    .champions {
        border-left: 4px solid #1769e0;
    }

    .europa {
        border-left: 4px solid #f2b600;
    }

    .relegation {
        border-left: 4px solid #e30613;
    }

    .legend {
        margin-top: 15px;
        font-size: 13px;
        color: #666;
    }

    @media(max-width: 800px) {
        .content {
            grid-template-columns: 1fr;
        }

        header h1 {
            font-size: 25px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>🇪🇸 LaLiga Eredménykövető</h1>
    <p>2026/27-es spanyol elsőosztályú labdarúgó-bajnokság</p>
</header>

<div class="container">

    <div class="round-selector">
        <h2>⚽ Fordulók</h2>
        <div class="round-buttons" id="roundButtons"></div>
    </div>

    <div class="content">

        <div class="card">
            <h2 id="roundTitle">1. forduló</h2>
            <div id="matches"></div>
        </div>

        <div class="card">
            <h2>🏆 Bajnoki tabella</h2>

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Csapat</th>
                        <th>P</th>
                        <th>M</th>
                        <th>GY</th>
                        <th>D</th>
                        <th>V</th>
                        <th>GK</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>
            </table>

            <div class="legend">
                <p>🔵 Bajnokok Ligája</p>
                <p>🟡 Európa-liga</p>
                <p>🔴 Kiesőhely</p>
            </div>
        </div>

    </div>
</div>

<script>

/* ============================================
   20 LALIGA CSAPAT
============================================ */

const teams = [
    "Athletic Club",
    "Atlético de Madrid",
    "CA Osasuna",
    "Celta",
    "Deportivo Alavés",
    "Elche CF",
    "FC Barcelona",
    "Getafe CF",
    "Levante UD",
    "Málaga CF",
    "R. Racing Club",
    "Rayo Vallecano",
    "RC Deportivo",
    "RCD Espanyol",
    "Real Betis",
    "Real Madrid",
    "Real Sociedad",
    "Sevilla FC",
    "Valencia CF",
    "Villarreal CF"
];

/* Rövidítések a tabellához */

const shortNames = {
    "Athletic Club": "ATH",
    "Atlético de Madrid": "ATM",
    "CA Osasuna": "OSA",
    "Celta": "CEL",
    "Deportivo Alavés": "ALA",
    "Elche CF": "ELC",
    "FC Barcelona": "BAR",
    "Getafe CF": "GET",
    "Levante UD": "LEV",
    "Málaga CF": "MAL",
    "R. Racing Club": "RAC",
    "Rayo Vallecano": "RAY",
    "RC Deportivo": "DEP",
    "RCD Espanyol": "ESP",
    "Real Betis": "BET",
    "Real Madrid": "RMA",
    "Real Sociedad": "RSO",
    "Sevilla FC": "SEV",
    "Valencia CF": "VAL",
    "Villarreal CF": "VIL"
};


/* ============================================
   TABELLÁHOZ ADATOK
============================================ */

const standings = {};

/*
   A 2026/27-es aktuális tabella adatai.
   A mérkőzések eredményeit később automatikusan
   is lehet számolni a fordulók eredményeiből.
*/

const currentTable = [
    ["FC Barcelona",21,7,7,0,0,31,7],
    ["Atlético de Madrid",16,7,5,1,1,16,7],
    ["Real Betis",16,7,5,1,1,9,7],
    ["Real Madrid",15,7,5,0,2,18,8],
    ["Sevilla FC",13,7,4,1,2,10,9],
    ["Deportivo Alavés",11,7,3,2,2,11,6],
    ["RC Deportivo",10,7,2,4,1,10,8],
    ["Real Sociedad",10,7,3,1,3,9,13],
    ["Villarreal CF",8,7,2,2,3,13,12],
    ["Athletic Club",8,6,2,2,2,7,6],
    ["Getafe CF",8,7,2,2,3,4,7],
    ["Rayo Vallecano",8,7,2,2,3,11,16],
    ["CA Osasuna",8,7,2,2,3,6,13],
    ["Celta",7,7,1,4,2,8,6],
    ["RCD Espanyol",7,7,2,1,4,10,10],
    ["R. Racing Club",7,7,2,1,4,11,21],
    ["Valencia CF",6,7,1,3,3,7,11],
    ["Elche CF",5,7,1,2,4,8,14],
    ["Levante UD",4,7,1,1,5,7,15],
    ["Málaga CF",1,7,0,1,6,5,14]
];

currentTable.forEach(row => {

    standings[row[0]] = {
        pts: row[1],
        played: row[2],
        win: row[3],
        draw: row[4],
        loss: row[5],
        gf: row[6],
        ga: row[7]
    };

});


/* ============================================
   38 FORDULÓ GENERÁLÁSA
============================================ */

/*
   A "circle method" segítségével létrehozunk
   egy teljes 20 csapatos bajnoki menetrendet.

   20 csapat × 19 ellenfél = 190 meccs
   + visszavágók = 380 mérkőzés
   = 38 forduló × 10 mérkőzés
*/

function generateRounds() {

    let list = [...teams];

    let rounds = [];

    for (let round = 0; round < 19; round++) {

        let matches = [];

        for (let i = 0; i < 10; i++) {

            let home = list[i];
            let away = list[19 - i];

            if (round % 2 === 0) {
                matches.push({
                    home: home,
                    away: away
                });
            } else {
                matches.push({
                    home: away,
                    away: home
                });
            }
        }

        rounds.push(matches);

        /*
          Körkörös forgatás:
          az első csapat marad,
          a többi körbeforog.
        */

        let fixed = list[0];

        let rotating = list.slice(1);

        rotating.unshift(rotating.pop());

        list = [fixed, ...rotating];
    }

    /*
       Második kör:
       ugyanazok a párosítások,
       csak megfordított hazai pályával.
    */

    let secondHalf = rounds.map(round => {

        return round.map(match => ({
            home: match.away,
            away: match.home
        }));

    });

    return [...rounds, ...secondHalf];
}

const rounds = generateRounds();


/* ============================================
   NÉHÁNY VALÓDI EREDMÉNY A 8. FORDULÓHOZ
============================================ */

const realResults = {

    "Málaga CF-RCD Espanyol": [1, 1],
    "Rayo Vallecano-Athletic Club": [2, 1],
    "Deportivo Alavés-Atlético de Madrid": [0, 2],
    "FC Barcelona-Getafe CF": [4, 0],
    "Real Madrid-Villarreal CF": [3, 1],
    "Elche CF-Celta": [1, 1],
    "Real Sociedad-RC Deportivo": [2, 0],
    "Real Betis-CA Osasuna": [2, 1],
    "R. Racing Club-Valencia CF": [1, 2],
    "Levante UD-Sevilla FC": [1, 1]
};


/* ============================================
   FORDULÓ MEGJELENÍTÉSE
============================================ */

function showRound(roundNumber) {

    const matchesContainer =
        document.getElementById("matches");

    const title =
        document.getElementById("roundTitle");

    title.textContent =
        roundNumber + ". forduló";

    matchesContainer.innerHTML = "";

    const selectedRound = rounds[roundNumber - 1];

    selectedRound.forEach((match, index) => {

        let score = "–";

        /*
           Ha van hozzá valódi eredmény,
           akkor azt jelenítjük meg.
        */

        const key =
            match.home + "-" + match.away;

        if (realResults[key]) {

            score =
                realResults[key][0] +
                " : " +
                realResults[key][1];

        } else {

            /*
               A többi mérkőzésnél egyelőre
               időpont jelenik meg.
            */

            const times = [
                "16:00",
                "18:15",
                "18:15",
                "20:00",
                "21:00"
            ];

            score =
                '<span class="time">' +
                times[index % times.length] +
                "</span>";
        }

        const matchElement =
            document.createElement("div");

        matchElement.className = "match";

        matchElement.innerHTML = `
            <div class="team home">
                ${match.home}
            </div>

            <div class="score">
                ${score}
            </div>

            <div class="team away">
                ${match.away}
            </div>
        `;

        matchesContainer.appendChild(matchElement);

    });
}


/* ============================================
   FORDULÓ GOMBOK
============================================ */

const roundButtons =
    document.getElementById("roundButtons");

for (let i = 1; i <= 38; i++) {

    const button =
        document.createElement("button");

    button.className = "round-button";

    button.textContent = i + ".";

    button.onclick = () => {

        document
            .querySelectorAll(".round-button")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        showRound(i);
    };

    roundButtons.appendChild(button);
}


/* ============================================
   TABELLÁZAT
============================================ */

function drawTable() {

    const body =
        document.getElementById("tableBody");

    body.innerHTML = "";

    /*
       Pontszám szerint rendezzük a csapatokat.
       Holtversenynél gólkülönbség dönt.
    */

    const sorted =
        Object.entries(standings)
        .sort((a,b) => {

            if (b[1].pts !== a[1].pts)
                return b[1].pts - a[1].pts;

            const gdA = a[1].gf - a[1].ga;
            const gdB = b[1].gf - b[1].ga;

            return gdB - gdA;
        });


    sorted.forEach((entry, index) => {

        const team = entry[0];
        const data = entry[1];

        const position = index + 1;

        const goalDifference =
            data.gf - data.ga;

        let rowClass = "";

        if (position <= 4) {
            rowClass = "champions";
        }
        else if (position <= 6) {
            rowClass = "europa";
        }
        else if (position >= 18) {
            rowClass = "relegation";
        }

        const row =
            document.createElement("tr");

        row.className = rowClass;

        row.innerHTML = `
            <td class="position">${position}</td>

            <td>
                <span class="team-logo">
                    ${shortNames[team]}
                </span>
                ${team}
            </td>

            <td><strong>${data.pts}</strong></td>
            <td>${data.played}</td>
            <td>${data.win}</td>
            <td>${data.draw}</td>
            <td>${data.loss}</td>
            <td>
                ${goalDifference > 0 ? "+" : ""}
                ${goalDifference}
            </td>
        `;

        body.appendChild(row);

    });
}


/* ============================================
   INDÍTÁS
============================================ */

drawTable();

/* Első forduló kiválasztása */

document
    .querySelector(".round-button")
    .classList.add("active");

showRound(1);

</script>

</body>
</html>
